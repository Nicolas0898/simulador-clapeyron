<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>simulador-claypeyron</title>
</head>

<body>
  <main class="container mt-4">
    <!-- Gráfico -->
    <div id="plot" style="min-height: 550px;"></div>

    <!-- Configurações -->
    <hr class="border border-secondary">
    <!-- <h3 class="">-------:</h3> -->
    <form class="container" id="form">
      <!-- Valores  -->
      <div class="row mb-2">
        <h5>Valores:</h5>

        <div class="row mb-2 pe-0">
          <div class="input-group pe-0">
            <span class="input-group-text">
              Incógnita:
            </span>

            <select id="calc_target" class="form-control">
              <option value="temp">Temperatura</option>
              <option value="pressure">Pressão</option>
              <option value="volume">Volume</option>
              <option value="n">Quantidade de matéria</option>
            </select>
          </div>
        </div>

        <div class="row d-none d-md-block pe-0">
          <div class="input-group pe-0">
            <span class="col input-group-text">Pressão <span id="pressure_unity_display"
                class="fst-italic">(atm)</span></span>
            <span class="col-auto input-group-text text-opacity-100" style="color: rgb(0,0,0,0);">&times;</span>
            <span class="col input-group-text">Volume <span id="volume_unity_display"
                class="fst-italic">(L)</span></span>
            <span class="col-auto input-group-text text-opacity-100" style="color: rgb(0,0,0,0);">&equals;</span>
            <span class="col input-group-text">Temperatura <span id="temperature_unity_display"
                class="fst-italic">(K)</span></span>
            <span class="col-auto input-group-text text-opacity-100" style="color: rgb(0,0,0,0);">&times;</span>
            <span class="col input-group-text">Constante R</span>
            <span class="col-auto input-group-text text-opacity-100" style="color: rgb(0,0,0,0);">&times;</span>
            <span class="col input-group-text">Quant. de matéria <span id="n_unity_display" class="fst-italic">(Mol)</span></span>
          </div>
        </div>

        <div class="row pe-0">
          <div class="input-group flex-wrap pe-0">
            <input class="col-md form-control" type="number" step=".1" min="0" id="pressure_input" value="5">
            <span class="col-auto input-group-text">&times;</span>
            <input class="col-md form-control" type="number" step=".1" min="0" id="volume_input" value="5">
            
            <span class="col-auto input-group-text">=</span>
            <input class="col-md form-control" type="number" step=".1" min="0" id="temperature_input" value="304.878">
            
            <span class="col-auto input-group-text">&times;</span>
            <input class="col-md form-control text-secondary" type="number" id="R_input" readonly value="0.082">
            
            <span class="col-auto input-group-text">&times;</span>
            <input class="col-md form-control" type="number" id="n_input" step=".1" value="1">
          
          </div>
        </div>
      </div>

      <div class="row mb-2">
        <!-- Unidades -->
        <section class="col-md-6 mb-2">
          <h5>Unidades:</h5>
          <span>Unidade do Volume:</span>
          <select id="unity" class="form-control col-md-6">
            <option value="atm">Litros (L) / Atmosferas (Atm)</option>
            <option value="pa">Metros Cúbicos (m³) / Pascal (Pa)</option>
          </select>
         Constante R:
          <div class="input-group">
            <label class="input-group-text"><i>R</i>&ThickSpace;&equals;</label>
            <input class="form-control" type="number" id="r_display" step="any" readonly value="0.082">
          </div>
        </section>

        <!-- Intervalos -->
        <section class="col-md-6">
          <h5>Configurações do gráfico:</h5>
          <span>Intervalo Volume:</span>
          <div class="input-group">
            <span class="input-group-text">Min:</span>
            <input type="number" step="any" class="form-control" id="volume_min" min="0" value="1">
            <span class="input-group-text">Max:</span>
            <input type="number" step="any" class="form-control" id="volume_max" min="0" value="10">
          </div>
          <span>Intervalo Pressão:</span>
          <div class="input-group mb-1">
            <div class="input-group">
              <span class="input-group-text">Min:</span>
              <input type="number" step="any" class="form-control" id="pressure_min" min="0" value="1">
              <span class="input-group-text">Max:</span>
              <input type="number" step="any" class="form-control" id="pressure_max" min="0" value="10">
            </div>
          </div>
          <span>Escala das cores (Temperatura):</span>
          <div class="input-group mb-1">
            <div class="input-group">
              <span class="input-group-text">Min:</span>
              <input type="number" step="any" class="form-control" id="intensity_min" min="0" value="100">
              <span class="input-group-text fst-italic">K</span>
              <span class="input-group-text">Max:</span>
              <input type="number" step="any" class="form-control" id="intensity_max" min="0" value="1100">
              <span class="input-group-text fst-italic">K</span>
            </div>
          </div>
        </section>


      </div>
    </form>
    <!-- Sobre -->
    <hr class="border border-secondary">
    <h5>Como usar:</h5>

  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
